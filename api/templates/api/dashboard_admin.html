<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AquaPlants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-dark" style="background-color: #004D40;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">AquaPlants Dashboard</span>
            <span class="navbar-text text-white">
                Hola, {{ request.user.username }} | Rol: {% if request.user.is_superuser %}Administrador{% else %}Supervisor{% endif %}
            </span>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <div class="row">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body text-center py-5">
                        <h2 class="text-success">¡Inicio de sesión exitoso!</h2>
                        <p class="lead">El sistema de redirección y permisos web está funcionando.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
