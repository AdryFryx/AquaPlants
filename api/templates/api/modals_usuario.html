<!-- Modal Editar Usuario -->
<div class="modal fade" id="modalEditarUser{{ user.id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content text-start">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Editar Usuario @{{ user.username }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="{% url 'editar_usuario_web' %}" method="POST">
                {% csrf_token %}
                <div class="modal-body">
                    <input type="hidden" name="usuario_id" value="{{ user.id }}">
                    <div class="mb-3"><label>Nombre</label><input type="text" name="nombre" class="form-control" value="{{ user.first_name }}"></div>
                    <div class="mb-3"><label>Apellido</label><input type="text" name="apellido" class="form-control" value="{{ user.last_name }}"></div>
                    <div class="mb-3"><label>Correo</label><input type="email" name="email" class="form-control" value="{{ user.email }}"></div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Eliminar Usuario -->
<div class="modal fade" id="modalEliminarUser{{ user.id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content text-start">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Eliminar Usuario</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="{% url 'eliminar_usuario_web' %}" method="POST">
                {% csrf_token %}
                <div class="modal-body">
                    <input type="hidden" name="usuario_id" value="{{ user.id }}">
                    <p>¿Estás seguro de que deseas eliminar a <strong>{{ user.first_name }} {{ user.last_name }}</strong>?</p>
                    <p class="text-danger fw-bold"><i class="bi bi-exclamation-triangle"></i> Esta acción es irreversible.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
